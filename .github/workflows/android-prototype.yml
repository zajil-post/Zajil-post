name: Android Prototype APK

on:
  push:
    branches:
      - app/android-prototype
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-prototype.yml'
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'manifest.json'
      - 'icon.svg'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor web directory
        run: mkdir -p www && printf '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>جاري فتح زاجل…</body></html>' > www/index.html

      - name: Generate Android project
        run: npx cap add android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: zajil-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
